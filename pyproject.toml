[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oplab"
version = "0.1.0"
description = "Operations analytics toolkit: logistics KPIs, statistical process control and synthetic supply chain data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fabiojmjr-oss" }]
keywords = ["logistics", "supply-chain", "spc", "six-sigma", "kpi", "operations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
]

[project.urls]
Homepage = "https://github.com/fabiojmjr-oss/ferramentas-de-trabalho"
Source = "https://github.com/fabiojmjr-oss/ferramentas-de-trabalho"

[tool.hatch.build.targets.wheel]
packages = ["src/oplab"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PD"]
ignore = ["PD010", "PD011"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
# No python_version pin: CI runs a version matrix, and pinning it makes mypy reject the
# numpy stubs of whichever interpreter is newer than the pin.
files = ["src/oplab"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: builds the full default dataset; a few seconds each",
]

[tool.coverage.run]
source = ["oplab"]
branch = true
